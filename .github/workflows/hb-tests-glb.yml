name: GLB tests

# Kept separate from tests.yml so that the GLB feature adds no lines to a file
# upstream edits regularly, and syncing from actions-for-kicad/kicad-actions
# stays conflict-free.

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "**/*.md"

jobs:
  test-pcb-glb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: glb
            expected_file: pcb.glb
          - test_name: glb-copper
            expected_file: pcb.glb
            pcb_output_glb_tracks: true
            pcb_output_glb_zones: true
          - test_name: glb-board-only
            expected_file: board.glb
            pcb_output_glb_file_name: board.glb
            pcb_output_glb_board_only: true
          - test_name: glb-raw
            expected_file: pcb.glb
            # Quoted so the '||' default below does not treat it as unset.
            pcb_output_glb_optimize: "false"
          - test_name: glb-scaled
            expected_file: pcb.glb
            pcb_output_glb_scale: "1000.0"
          - test_name: glb-metal-colors
            expected_file: pcb.glb
            pcb_output_glb_metal_colors: "A5A392,#227205"
          - test_name: glb-realistic
            expected_file: pcb.glb
            pcb_output_glb_tracks: true
            pcb_output_glb_zones: true
            pcb_output_glb_mask_opacity: "0.83"
          - test_name: glb-mesh-uncompressed
            expected_file: pcb.glb
            pcb_output_glb_compression: none
          - test_name: glb-mesh-unquantized
            expected_file: pcb.glb
            pcb_output_glb_quantize: "false"
          - test_name: glb-mesh-simplified
            expected_file: pcb.glb
            pcb_output_glb_simplify: "0.5"
          - test_name: glb-mesh-off
            expected_file: pcb.glb
            # Quoted so the '||' default below does not treat it as unset.
            pcb_output_glb_optimize_mesh: "false"
          # The test board is the reproduction case: BT101 and SW101 reference
          # a .wrl the image does not ship, D101 a .step it does.
          - test_name: glb-wrl-fallback-off
            expected_file: pcb.glb
            # Quoted so the '||' default below does not treat it as unset.
            pcb_output_glb_wrl_fallback: "false"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run GLB export
        uses: ./
        with:
          pcb_file_name: tests/kicad-project-success/kicad-project.kicad_pcb
          footprint_libraries: "test-fp-library=tests/kicad-project-success/test-fp-library.pretty"
          pcb_output_glb: true
          pcb_output_glb_file_name: ${{ matrix.pcb_output_glb_file_name || 'pcb.glb' }}
          pcb_output_glb_tracks: ${{ matrix.pcb_output_glb_tracks || false }}
          pcb_output_glb_zones: ${{ matrix.pcb_output_glb_zones || false }}
          pcb_output_glb_board_only: ${{ matrix.pcb_output_glb_board_only || false }}
          pcb_output_glb_optimize: ${{ matrix.pcb_output_glb_optimize || 'true' }}
          pcb_output_glb_scale: ${{ matrix.pcb_output_glb_scale || '1.0' }}
          pcb_output_glb_metal_colors: ${{ matrix.pcb_output_glb_metal_colors || null }}
          pcb_output_glb_mask_opacity: ${{ matrix.pcb_output_glb_mask_opacity || '1.0' }}
          pcb_output_glb_optimize_mesh: ${{ matrix.pcb_output_glb_optimize_mesh || 'true' }}
          pcb_output_glb_compression: ${{ matrix.pcb_output_glb_compression || 'meshopt' }}
          pcb_output_glb_quantize: ${{ matrix.pcb_output_glb_quantize || 'true' }}
          pcb_output_glb_simplify: ${{ matrix.pcb_output_glb_simplify || '1.0' }}
          pcb_output_glb_wrl_fallback: ${{ matrix.pcb_output_glb_wrl_fallback || 'true' }}

      - name: Verify output file
        run: |
          file="${{ matrix.expected_file }}"
          if [[ ! -f "$file" ]]; then
            echo "::error::Expected output file '$file' not found!"
            exit 1
          fi
          # KiCad's jobset writer has shipped a gzipped STEP under a '.glb'
          # name before (kicad#23706), so existence alone proves nothing.
          # Assert the glTF container magic.
          magic=$(head -c 4 "$file")
          if [[ "$magic" != "glTF" ]]; then
            echo "::error::'$file' is not a binary glTF file (magic '$magic')."
            exit 1
          fi
        shell: bash

      # The magic bytes prove it is a GLB, not that the passes that were
      # asked for ran. A recentre that composes wrongly with --scale, an
      # OpenCASCADE label left in a node name, a board layer still set to
      # BLEND or a mesh optimization that quietly did nothing all produce a
      # perfectly valid GLB, so assert the outcomes directly.
      #
      # The checker lives in a file rather than a heredoc so it can be run
      # against a real board by hand:
      #   python3 tests/verify-glb.py board.glb --mask-opacity 0.83 \
      #     --optimized-mesh --compressed
      - name: Verify post-processing
        if: ${{ matrix.pcb_output_glb_optimize != 'false' }}
        run: |
          flags=()
          if [[ "${{ matrix.pcb_output_glb_optimize_mesh || 'true' }}" == "true" ]]; then
            # On this test board the primitive count is low enough before
            # merging that the checker's ceiling cannot fail; what proves
            # gltfpack ran here is the extensions it is required to write.
            flags+=(--optimized-mesh)
            case "${{ matrix.pcb_output_glb_compression || 'meshopt' }}" in
              meshopt|meshopt-high) flags+=(--compressed) ;;
            esac
            if [[ "${{ matrix.pcb_output_glb_quantize || 'true' }}" != "true" ]]; then
              flags+=(--unquantized)
            fi
          fi
          # BT101 references '...BatteryHolder_Bulgin_BX0036_1xC.wrl', and the
          # -full image ships that model as .step only, so whether the
          # component reaches the GLB is exactly the fallback's outcome. Not
          # asserted for a board-only export, which has no components at all.
          if [[ "${{ matrix.pcb_output_glb_board_only || 'false' }}" != "true" ]]; then
            if [[ "${{ matrix.pcb_output_glb_wrl_fallback || 'true' }}" == "true" ]]; then
              flags+=(--require-component BT101)
            else
              flags+=(--forbid-component BT101)
            fi
            # Unconditional: D101's model is a .step already, so it is the
            # control that separates "the fallback worked" from "components
            # export at all".
            flags+=(--require-component D101)
          fi
          python3 tests/verify-glb.py "${{ matrix.expected_file }}" \
            --scale "${{ matrix.pcb_output_glb_scale || '1.0' }}" \
            --mask-opacity "${{ matrix.pcb_output_glb_mask_opacity || '1.0' }}" \
            "${flags[@]}"
        shell: bash
